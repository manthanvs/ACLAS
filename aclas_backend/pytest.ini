[pytest]
DJANGO_SETTINGS_MODULE = aclas.settings
python_files = tests*.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
    --strict-markers
markers =
    unit: Pure unit tests (no DB, no HTTP)
    integration: Integration tests (DB + HTTP)
    slow: Tests that take longer than usual
